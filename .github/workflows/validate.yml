name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install cfn-lint
      - run: cfn-lint template.yaml

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install checkov
      - run: checkov -f template.yaml --framework cloudformation --compact --config-file .checkov.yaml
