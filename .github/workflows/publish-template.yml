name: Publish template to S3

# Triggered by the tag release-please creates (not by the Release workflow's
# own push-to-main run) because github-actions-public-templates-role's OIDC
# trust policy only trusts this repo for ref:refs/tags/* - a run triggered
# by a branch push has sub ref:refs/heads/main and would be rejected. This
# also means the publish step only ever runs against an actual tagged
# release, never an arbitrary main commit.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-public-templates-role
          aws-region: us-east-2

      - name: publish template.yaml
        env:
          # Fixed name, not generated at apply time - see infra's
          # modules/public_templates.
          BUCKET: infracost-public-templates
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          aws s3 cp template.yaml "s3://${BUCKET}/cloudformation-aws-integration/v${VERSION}/template.yaml"
          aws s3 cp template.yaml "s3://${BUCKET}/cloudformation-aws-integration/latest/template.yaml"
